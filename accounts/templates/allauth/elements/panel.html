{% comment %} djlint:off {% endcomment %}
{% load allauth %}

<section class="{{ attrs.class }}">
    <h2>
        {% slot title %}
        {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
        <ul class="flex flex-wrap gap-3">
            {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
        </ul>
    {% endif %}
</section>
